services:
  - type: web
    name: rcss-arena-public
    runtime: docker
    plan: free
    healthCheckPath: /healthz
    envVars:
      - key: ARENA_USER
        sync: false
      - key: ARENA_PASSWORD
        sync: false
      - key: GITHUB_REPOSITORY
        value: tahalkhaftan/RCSS-arena
      - key: GITHUB_TOKEN
        sync: false
      - key: STORAGE_REPOSITORY
        value: tahalkhaftan/RCSS-arena-data
      - key: GITHUB_REF
        value: main
      - key: ARENA_ACCOUNTS_STORE
        value: github
      - key: ARENA_PUBLIC_URL
        value: https://rcss-arena-public.onrender.com
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: ARENA_OWNER_EMAIL
        sync: false
      - key: ZARINPAL_MERCHANT_ID
        sync: false
