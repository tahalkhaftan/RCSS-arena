name: Verify team runtime
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/verify-runtime.yml'
      - '.github/workflows/matches.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  real-matches:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install server build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake build-essential flex libfl-dev bison libboost-all-dev zlib1g-dev
      - name: Restore compiled server
        id: server-cache
        uses: actions/cache@v4
        with:
          path: server-install
          key: rcss19-ubuntu24-${{ hashFiles('vendor/rcssserver-19.0.0/**') }}
      - name: Build RCSSServer 19
        if: steps.server-cache.outputs.cache-hit != 'true'
        run: |
          cmake -S vendor/rcssserver-19.0.0 -B server-build -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX="$GITHUB_WORKSPACE/server-install"
          cmake --build server-build -j4
          cmake --install server-build
      - name: Complete real games with modern and older team binaries
        env:
          LD_LIBRARY_PATH: ${{ github.workspace }}/server-install/lib
          RCSSSERVER: ${{ github.workspace }}/server-install/bin/rcssserver
          MATCH_TIMEOUT_SECONDS: '400'
        run: PYTHONPATH=. python3 scripts/verify_team_runtime.py
      - name: Retain verification reports and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: team-runtime-verification
          path: |
            runtime-verification/results.json
            runtime-verification/*/logs/
          retention-days: 3
