name: RCSS Crash Diagnostic
# Compare the supplied opponent with a control team on the same server.
on:
  push:
    branches: [main]
    paths: ['.github/workflows/diagnose.yml']
  workflow_dispatch:
    inputs:
      release_id:
        description: Private source test release
        default: '404029495'
        required: true
        type: string
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install debug build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake build-essential flex libfl-dev bison libboost-all-dev zlib1g-dev gdb
      - name: Build debug RCSSServer 19
        run: |
          cmake -S vendor/rcssserver-19.0.0 -B server-debug-build -DCMAKE_BUILD_TYPE=RelWithDebInfo -DCMAKE_INSTALL_PREFIX="$GITHUB_WORKSPACE/server-debug-install"
          cmake --build server-debug-build -j4
          cmake --install server-debug-build
      - name: Reproduce private match and retain backtrace
        env:
          STORAGE_TOKEN: ${{ secrets.STORAGE_TOKEN }}
          STORAGE_REPOSITORY: ${{ vars.STORAGE_REPOSITORY }}
          RELEASE_ID: ${{ inputs.release_id || '404029495' }}
          LD_LIBRARY_PATH: ${{ github.workspace }}/server-debug-install/lib
          RCSSSERVER: ${{ github.workspace }}/server-debug-install/bin/rcssserver
        run: |
          python3 diagnose.py
          DIAGNOSTIC_SCENARIO=control python3 diagnose.py
