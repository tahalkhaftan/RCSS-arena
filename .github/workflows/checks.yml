name: Check project
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - run: python3 -m unittest discover -s tests -v
      - run: node tests/ui_polling.cjs
      - run: node tests/ui_monitor.cjs
      - run: node tests/ui_ratings.cjs
      - run: node tests/ui_performance.cjs
      - run: node tests/ui_build.cjs
      - run: node tests/ui_prebuild.cjs
      - run: node tests/ui_offline.cjs
      - run: node tests/ui_workbench.cjs
      - run: node tests/ui_personal.cjs
      - run: node tests/ui_auto_next.cjs
      - run: node tests/ui_smooth_live.cjs
      - run: node tests/ui_live_timeline.cjs
      - run: node tests/ui_local_rcg.cjs
      - run: python3 -m compileall -q app.py cloud_app.py github_api.py action_job.py runner.py analysis.py
      - name: Verify monitor in desktop and mobile browser layouts
        timeout-minutes: 3
        run: |
          npm install --prefix "$RUNNER_TEMP/arena-browser" --ignore-scripts --no-package-lock playwright@1.51.1
          CHROME_BIN=/usr/bin/google-chrome NODE_PATH="$RUNNER_TEMP/arena-browser/node_modules" node tests/browser_native.cjs
          CHROME_BIN=/usr/bin/google-chrome NODE_PATH="$RUNNER_TEMP/arena-browser/node_modules" node tests/browser_native_bridge.cjs
      - name: Retain monitor screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: monitor-layouts
          path: |
            /tmp/workbench-desktop.png
            /tmp/workbench-mobile.png
            /tmp/soccerwindow-desktop.png
            /tmp/soccerwindow-mobile.png
            /tmp/arena-monitor-desktop.png
            /tmp/arena-monitor-mobile.png
          retention-days: 3
