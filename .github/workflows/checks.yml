name: Check project
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - run: python3 -m unittest discover -s tests -v
      - run: node tests/ui_polling.cjs
      - run: python3 -m compileall -q app.py cloud_app.py github_api.py action_job.py runner.py analysis.py
