name: Prepare reusable RCSS runtime
on:
  workflow_dispatch:
  workflow_call:
    outputs:
      image:
        description: Exact digest of the prepared Ubuntu match/build environment
        value: ${{ jobs.prepare.outputs.image }}
permissions:
  contents: read
  packages: write
jobs:
  prepare:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    concurrency:
      group: arena-runtime-publisher
      cancel-in-progress: false
    outputs:
      image: ${{ steps.resolve.outputs.image }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Look up the already prepared environment
        id: lookup
        shell: bash
        env:
          ARENA_REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          image="ghcr.io/${ARENA_REPOSITORY,,}-runtime:$(python3 runtime/image_key.py)"
          echo "tag=$image" >> "$GITHUB_OUTPUT"
          if docker buildx imagetools inspect "$image" >/dev/null 2>&1; then
            echo 'exists=true' >> "$GITHUB_OUTPUT"
            echo 'Using prepared server and both pinned team libraries; no installation/build.' >> "$GITHUB_STEP_SUMMARY"
          else
            echo 'exists=false' >> "$GITHUB_OUTPUT"
          fi
      - name: Build and publish only when the runtime changes
        if: steps.lookup.outputs.exists != 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: runtime/Dockerfile
          push: true
          tags: ${{ steps.lookup.outputs.tag }}
          labels: org.opencontainers.image.source=https://github.com/${{ github.repository }}
          cache-from: type=gha,scope=arena-runtime
          cache-to: type=gha,mode=max,scope=arena-runtime
      - name: Resolve immutable image digest
        id: resolve
        shell: bash
        env:
          ARENA_IMAGE_TAG: ${{ steps.lookup.outputs.tag }}
        run: |
          set -euo pipefail
          digest="$(docker buildx imagetools inspect "$ARENA_IMAGE_TAG" --format '{{.Manifest.Digest}}')"
          [[ "$digest" =~ ^sha256:[a-f0-9]{64}$ ]]
          image="${ARENA_IMAGE_TAG%:*}@$digest"
          echo "image=$image" >> "$GITHUB_OUTPUT"
          echo "Prepared runtime: \`$image\`" >> "$GITHUB_STEP_SUMMARY"
