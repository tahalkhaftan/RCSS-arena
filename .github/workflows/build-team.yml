name: Build source team
run-name: Team build ${{ inputs.release_id }}
on:
  workflow_dispatch:
    inputs:
      release_id:
        description: Private team build release ID
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: arena-team-build-${{ inputs.release_id }}
  cancel-in-progress: false
jobs:
  runtime:
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/prepare-runtime.yml
  build:
    needs: runtime
    permissions:
      contents: read
      packages: read
    container:
      image: ${{ needs.runtime.outputs.image }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Build and publish reusable team
        env:
          STORAGE_TOKEN: ${{ secrets.STORAGE_TOKEN }}
          STORAGE_REPOSITORY: ${{ vars.STORAGE_REPOSITORY }}
          RELEASE_ID: ${{ inputs.release_id }}
        run: python3 build_job.py
