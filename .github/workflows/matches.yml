name: RCSS Matches
run-name: Arena ${{ inputs.release_id }}
on:
  workflow_dispatch:
    inputs:
      release_id:
        description: Release ID created by Arena website
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: rcss-matches
  cancel-in-progress: false
jobs:
  runtime:
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/prepare-runtime.yml
  matches:
    needs: runtime
    permissions:
      contents: read
      packages: read
    container:
      image: ${{ needs.runtime.outputs.image }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Run matches and publish results
        env:
          STORAGE_TOKEN: ${{ secrets.STORAGE_TOKEN }}
          STORAGE_REPOSITORY: ${{ vars.STORAGE_REPOSITORY }}
          RELEASE_ID: ${{ inputs.release_id }}
          MATCH_TIMEOUT_SECONDS: '1800'
        run: python3 action_job.py
