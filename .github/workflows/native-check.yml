name: Verify original SoccerWindow2
on:
  push:
    paths:
      - 'Dockerfile'
      - 'native_*.py'
      - 'native/**'
      - 'scripts/patch_native_bridge.py'
      - 'static/native/**'
      - 'scripts/verify_native_desktop.py'
      - 'scripts/serve_native_latency.py'
      - 'tests/browser_native_latency.cjs'
      - '.github/workflows/native-check.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Build pinned original Qt desktop and noVNC
        run: docker build -t arena-native .
      - name: Verify native program within free-tier memory limit
        run: |
          docker run --rm --memory=512m --cpus=1 -e PYTHONPATH=/app -v "$PWD/scripts:/checks:ro" --entrypoint python3 arena-native /checks/verify_native_desktop.py
      - name: Verify actual pointer and keyboard latency on 0.1 CPU
        timeout-minutes: 4
        run: |
          docker run -d --name arena-latency --memory=512m --cpus=0.1 -e PYTHONPATH=/app -p 127.0.0.1:18080:8000 -v "$PWD/scripts:/checks:ro" --entrypoint python3 arena-native /checks/serve_native_latency.py
          npm install --prefix "$RUNNER_TEMP/native-browser" --ignore-scripts --no-package-lock playwright@1.51.1
          NODE_PATH="$RUNNER_TEMP/native-browser/node_modules" node tests/browser_native_latency.cjs
      - name: Save native latency screenshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: native-input-latency
          path: /tmp/native-latency.png
          retention-days: 3
      - name: Native diagnostics and cleanup
        if: always()
        run: |
          docker logs arena-latency || true
          docker exec arena-latency sh -c 'tail -80 /tmp/arena-desktop/desktop.log' || true
          docker rm -f arena-latency || true
